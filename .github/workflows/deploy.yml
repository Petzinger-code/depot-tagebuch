name: Website und Wechselkurse

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 16 * * 1-5"   # werktags nach Veröffentlichung der EZB-Referenzkurse
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: EZB-Wechselkurse aktualisieren
        if: github.event_name != 'push'
        run: |
          curl -sSfL -o hist.zip https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
          unzip -o -q hist.zip
          python3 - <<'PY'
          import csv, json
          rows = list(csv.DictReader(open("eurofxref-hist.csv")))
          for cur in ["USD", "CHF", "GBP"]:
              r = {x["Date"]: float(x[cur]) for x in rows if x["Date"] >= "2020-01-01" and x.get(cur) not in (None, "", "N/A")}
              json.dump({"currency": cur, "source": "EZB Referenzkurse (Einheiten je 1 EUR)", "updated": max(r), "rates": dict(sorted(r.items()))},
                        open(f"fx/{cur}.json", "w"), separators=(",", ":"))
          PY
          rm -f hist.zip eurofxref-hist.csv
          if ! git diff --quiet fx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fx
            git commit -m "EZB-Wechselkurse aktualisieren"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
